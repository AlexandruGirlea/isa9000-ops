name: Deploy stack

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        default: ""
        type: string

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      github.workflow_ref == format('{0}/.github/workflows/release.yml@{1}',
      github.repository, github.ref)
    environment: ${{ inputs.environment }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      STACK: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      ADMIN_GROUP_ID: ${{ secrets.ADMIN_GROUP_ID }}
      AUTH_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets[format('PULUMI_{0}_CONFIG_PASSPHRASE', inputs.environment)] }}
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      STACK_CONFIG: ${{ vars.PULUMI_STACK_CONFIG }}
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58
      - name: Supply the workload identity to the Pulumi state backend
        run: python .github/azure_token.py
      - name: Deploy
        working-directory: infra
        run: |
          case "$STACK" in dev|test|prod) ;; *) exit 1 ;; esac
          test -n "$ADMIN_GROUP_ID"
          test -n "$PULUMI_CONFIG_PASSPHRASE"
          test -n "$STACK_CONFIG"
          printf '%s\n' "$STACK_CONFIG" > "Pulumi.$STACK.yaml"
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi stack select "$STACK"
          pulumi config set --secret isa9000:adminGroupId "$ADMIN_GROUP_ID"
          if [ -n "$AUTH_CLIENT_SECRET" ]; then
            pulumi config set --secret --path 'isa9000:authApp.clientSecret' "$AUTH_CLIENT_SECRET"
          fi
          registry=$(pulumi config get isa9000:registry 2>/dev/null || true)
          registry=$(printf '%s' "${registry##*/}" | tr '[:upper:]' '[:lower:]')
          # A stack with a registry deploys only the image this release pushed there.
          test "$registry" = "${IMAGE_TAG:+$REGISTRY}"
          if [ -n "$IMAGE_TAG" ]; then
            pulumi config set isa9000:imageTag "$IMAGE_TAG"
          fi
          pulumi up --yes --non-interactive
      - name: Smoke test
        working-directory: infra
        run: |
          # Each pulumi process exchanges this file again; the token from before a long deploy expired.
          python ../.github/azure_token.py
          web_url=$(pulumi stack output webUrl)
          resource_group=$(pulumi stack output resourceGroup)
          web_app=$(pulumi stack output webAppName)
          ingress=$(pulumi stack output ingress)
          image_tag=$(pulumi stack output imageTag)
          python ../.github/smoke.py "$web_url" "$resource_group" "$web_app" "$ingress" "$image_tag"
