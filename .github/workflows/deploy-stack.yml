name: Deploy stack

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        default: ""
        type: string

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      github.workflow_ref == format('{0}/.github/workflows/release.yml@{1}',
      github.repository, github.ref)
    environment: ${{ inputs.environment }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      STACK: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      ADMIN_GROUP_ID: ${{ secrets.ADMIN_GROUP_ID }}
      AUTH_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets[format('PULUMI_{0}_CONFIG_PASSPHRASE', inputs.environment)] }}
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      STACK_CONFIG: ${{ vars.PULUMI_STACK_CONFIG }}
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58
      - name: Deploy
        working-directory: infra
        run: |
          case "$STACK" in dev|test|prod) ;; *) exit 1 ;; esac
          test -n "$ADMIN_GROUP_ID"
          test -n "$PULUMI_CONFIG_PASSPHRASE"
          test -n "$STACK_CONFIG"
          printf '%s\n' "$STACK_CONFIG" > "Pulumi.$STACK.yaml"
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi stack select "$STACK"
          pulumi config set --secret isa9000:adminGroupId "$ADMIN_GROUP_ID"
          if [ -n "$AUTH_CLIENT_SECRET" ]; then
            pulumi config set --secret --path 'isa9000:authApp.clientSecret' "$AUTH_CLIENT_SECRET"
          fi
          if [ -n "$IMAGE_TAG" ]; then
            pulumi config set isa9000:imageTag "$IMAGE_TAG"
          fi
          pulumi up --yes --non-interactive
      - name: Smoke test
        working-directory: infra
        run: |
          python ../.github/smoke.py \
            "$(pulumi stack output webUrl)" \
            "$(pulumi stack output resourceGroup)" \
            "$(pulumi stack output webAppName)" \
            "$(pulumi stack output ingress)" \
            "$(pulumi stack output imageTag)"
