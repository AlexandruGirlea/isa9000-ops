name: Deploy stack

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        default: ""
        type: string

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      github.workflow_ref == format('{0}/.github/workflows/release.yml@{1}',
      github.repository, github.ref)
    environment: ${{ inputs.environment }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      STACK: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      ADMIN_GROUP_ID: ${{ secrets.ADMIN_GROUP_ID }}
      AUTH_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets[format('PULUMI_{0}_CONFIG_PASSPHRASE', inputs.environment)] }}
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      STACK_CONFIG: ${{ vars.PULUMI_STACK_CONFIG }}
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7
      - name: Supply the workload identity to the Pulumi state backend
        run: python .github/azure_token.py
      - name: Prepare deployment
        working-directory: infra
        run: |
          case "$STACK" in dev|test|prod) ;; *) exit 1 ;; esac
          test -n "$ADMIN_GROUP_ID"
          test -n "$PULUMI_CONFIG_PASSPHRASE"
          test -n "$STACK_CONFIG"
          printf '%s\n' "$STACK_CONFIG" > "Pulumi.$STACK.yaml"
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi stack select "$STACK"
          pulumi config set --secret isa9000:adminGroupId "$ADMIN_GROUP_ID"
          if [ -n "$AUTH_CLIENT_SECRET" ]; then
            pulumi config set --secret --path 'isa9000:authApp.clientSecret' "$AUTH_CLIENT_SECRET"
          fi
          registry=$(pulumi config get isa9000:registry 2>/dev/null || true)
          registry=$(printf '%s' "${registry##*/}" | tr '[:upper:]' '[:lower:]')
          # A stack with a registry deploys only the image this release pushed there.
          test "$registry" = "${IMAGE_TAG:+$REGISTRY}"
          if [ -n "$IMAGE_TAG" ]; then
            pulumi config set isa9000:imageTag "$IMAGE_TAG"
          fi
          # Prepare infrastructure and the migration job without switching live workloads.
          # Keep legacy database grants until those workloads switch to database-runtime.
          pulumi up --yes --non-interactive --exclude-dependents \
            --exclude 'urn:pulumi:**::azure-native:app:ContainerApp::web' \
            --exclude 'urn:pulumi:**::azure-native:app:Job::worker' \
            --exclude 'urn:pulumi:**::azure-native:app:Job::watchdog' \
            --exclude 'urn:pulumi:**::azure-native:app:ContainerAppsAuthConfig::easyauth' \
            --exclude 'urn:pulumi:**::azure-native:monitor:ScheduledQueryRule::worker-executions' \
            --exclude 'urn:pulumi:**::azure-native:authorization:RoleAssignment::web-secret-database' \
            --exclude 'urn:pulumi:**::azure-native:authorization:RoleAssignment::watchdog-secret-database'
      - name: Migrate database
        working-directory: infra
        run: |
          # The web app's database role cannot change the schema. This job holds the administrator
          # login: it migrates the schema and creates that role. It runs inside the stack's VNet,
          # because Postgres has no public access.
          python ../.github/azure_token.py
          group=$(pulumi stack output resourceGroup)
          job=$(pulumi stack output migrateJobName)
          az extension add --name containerapp --upgrade --yes --only-show-errors
          execution=$(az containerapp job start --resource-group "$group" --name "$job" \
            --query name --output tsv)
          for _ in $(seq 90); do
            status=$(az containerapp job execution show --resource-group "$group" --name "$job" \
              --job-execution-name "$execution" --query properties.status --output tsv)
            case "$status" in
              Succeeded) exit 0 ;;
              Running | Processing | "") sleep 10 ;;
              *) echo "The migration ended as $status." >&2; exit 1 ;;
            esac
          done
          echo "The migration did not finish in 15 minutes." >&2
          exit 1
      - name: Roll out application
        working-directory: infra
        run: |
          python ../.github/azure_token.py
          # Only a successful migration reaches this step. Complete the full stack update,
          # including switching workloads to the runtime role and removing legacy grants.
          pulumi up --yes --non-interactive
      - name: Smoke test
        working-directory: infra
        run: |
          # Each pulumi process exchanges this file again; the token from before a long deploy expired.
          python ../.github/azure_token.py
          web_url=$(pulumi stack output webUrl)
          resource_group=$(pulumi stack output resourceGroup)
          web_app=$(pulumi stack output webAppName)
          ingress=$(pulumi stack output ingress)
          image_tag=$(pulumi stack output imageTag)
          python ../.github/smoke.py "$web_url" "$resource_group" "$web_app" "$ingress" "$image_tag"
