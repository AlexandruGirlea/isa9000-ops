name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - run: uvx --from reuse==6.2.0 reuse lint
      - run: |
          uv run --frozen --project services ruff check .
          uv run --frozen --project services ruff check --config services/pyproject.toml local .github
      - run: uv run --frozen pytest -q
        working-directory: infra
      - run: make up && make test && make check
      - run: docker build --file services/Dockerfile --tag services:production .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: services:production
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.11@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f -color
      - if: always()
        run: make clean

  preview:
    if: >-
      github.event_name == 'pull_request' &&
      vars.ENABLE_AZURE_PREVIEW == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_DEV_CONFIG_PASSPHRASE }}
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Supply the workload identity to the Pulumi state backend
        run: python .github/azure_token.py
      - name: Write stack settings
        env:
          STACK_CONFIG: ${{ vars.PULUMI_STACK_CONFIG }}
        run: test -n "$STACK_CONFIG" && printf '%s\n' "$STACK_CONFIG" > infra/Pulumi.dev.yaml
      - uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7
        with:
          command: preview
          stack-name: dev
          work-dir: infra
          cloud-url: ${{ vars.PULUMI_BACKEND_URL }}
