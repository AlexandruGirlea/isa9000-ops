name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uvx --from reuse==6.2.0 reuse lint
      - run: |
          uv run --frozen --project services ruff check .
          uv run --frozen --project services ruff check --config services/pyproject.toml local .github
      - run: uv run --frozen pytest -q
        working-directory: infra
      - run: make up && make test && make check
      - run: docker build --file services/Dockerfile --tag services:production .
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: services:production
          severity: HIGH,CRITICAL
          exit-code: "1"
          scanners: vuln
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.11@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f -color
      - if: always()
        run: make clean

  preview:
    if: >-
      github.event_name == 'pull_request' &&
      vars.ENABLE_AZURE_PREVIEW == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_DEV_CONFIG_PASSPHRASE }}
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Write stack settings
        env:
          STACK_CONFIG: ${{ vars.PULUMI_STACK_CONFIG }}
        run: test -n "$STACK_CONFIG" && printf '%s\n' "$STACK_CONFIG" > infra/Pulumi.dev.yaml
      - uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58
        with:
          command: preview
          stack-name: dev
          work-dir: infra
          cloud-url: ${{ vars.PULUMI_BACKEND_URL }}
