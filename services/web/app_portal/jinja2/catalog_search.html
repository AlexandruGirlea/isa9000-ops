<form class="portal-search" role="search" method="get">
  <label for="catalog-search">{{ 'Find a podcast' if group is defined else 'Find a library' }}</label>
  <div class="portal-search-controls"><input id="catalog-search" name="q" type="search" value="{{ query }}" placeholder="{{ 'Search titles and descriptions' if group is defined else 'Search libraries' }}" autocomplete="off" maxlength="200" aria-controls="catalog-cards"><button>Search</button>{% if query %}<a href="?">Clear</a>{% endif %}</div>
  {% if query %}<p id="catalog-results" role="status" aria-live="polite">{{ pages.paginator.count }} found</p>{% endif %}
</form>
