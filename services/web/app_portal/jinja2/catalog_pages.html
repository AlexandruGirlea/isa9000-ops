{% if pages.has_other_pages() %}{% set search = 'q=' ~ query|urlencode ~ '&' if query else '' %}<nav class="catalog-pages" aria-label="Pages">{% if pages.has_previous() %}<a href="?{{ search }}page={{ pages.previous_page_number() }}">Previous</a>{% endif %}<span>Page {{ pages.number }} of {{ pages.paginator.num_pages }}</span>{% if pages.has_next() %}<a href="?{{ search }}page={{ pages.next_page_number() }}">Next</a>{% endif %}</nav>{% endif %}
