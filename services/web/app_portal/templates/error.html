<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ status }} · {{ title }}</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; color: #242330; background: #f7f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    main { width: 100%; max-width: 480px; padding: clamp(24px, 6vw, 40px); border: 1px solid #dedee8; border-radius: 16px; background: #fff; }
    .code { font-size: .9rem; font-weight: 700; color: #6041c4; letter-spacing: .08em; }
    h1 { font-size: clamp(1.5rem, 5vw, 2rem); line-height: 1.2; margin: 12px 0 16px; }
    p { line-height: 1.6; overflow-wrap: anywhere; }
    .reference { font-size: .8rem; color: #656574; margin: 24px 0; }
    a { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 18px; border-radius: 8px; background: #6041c4; color: #fff; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid #6041c4; outline-offset: 4px; }
    @media (prefers-color-scheme: dark) {
      :root { color: #efeff7; background: #11111a; }
      main { background: #1c1c29; border-color: #3c3c4c; }
      .code { color: #b6a0ff; }
      .reference { color: #afafc2; }
    }
  </style>
</head>
<body>
  <main>
    <div class="code">{{ status }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <p class="reference">Reference: {{ reference|default:"unavailable" }}</p>
    <a href="/">Back to sign-in</a>
  </main>
</body>
</html>
