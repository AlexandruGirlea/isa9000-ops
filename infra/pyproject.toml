[project]
name = "isa9000-infra"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pulumi==3.273.0",
    "pulumi-azure-native==3.30.0",
    "pulumi-azuread==6.11.2",
    "pulumi-random==4.21.6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff==0.17.0", "pyyaml>=6.0.3", "pip>=25"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP", "RUF", "PLE", "PLW", "ERA"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
